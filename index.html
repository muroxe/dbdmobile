<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Dead by Daylight Multiplayer</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    body, html { width: 100%; height: 100%; margin: 0; padding: 0; background-color: #000; font-family: Arial, sans-serif; overflow: hidden; color: #fff; touch-action: none; user-select: none; -webkit-tap-highlight-color: transparent; }
    #lobby-ui { position: absolute; z-index: 200; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(circle, #1f100a 0%, #050505 100%); }
    .lobby-btn { background: #3b82f6; border: 2px solid #fff; color: white; padding: 15px 30px; font-size: 18px; font-weight: bold; cursor: pointer; border-radius: 8px; margin: 10px; width: 250px; }
    .lobby-btn:active { background: #2563eb; transform: scale(0.95); }
    #room-input { padding: 15px; font-size: 18px; text-align: center; width: 220px; border-radius: 8px; border: 2px solid #555; background: #222; color: #fff; margin: 10px; }
    
    #game-container { position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: none; }
    canvas { display: block; width: 100%; height: 100%; }
    #fullscreen-btn { position: absolute; top: 15px; right: 15px; z-index: 1000; background: rgba(20, 20, 20, 0.8); border: 1px solid #555; color: #aaa; padding: 10px 15px; border-radius: 6px; font-weight: bold; font-size: 14px; cursor: pointer; pointer-events: auto; }
    #game-ui { display: none; position: absolute; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; z-index: 100; }
    #hud { position: absolute; top: 15px; left: 50%; transform: translateX(-50%); display: flex; gap: 20px; background: rgba(0, 0, 0, 0.75); padding: 10px 20px; border-radius: 12px; border: 1px solid #444; font-size: 14px; font-weight: bold; }
    #hud span { color: #ff4444; }
    #joystick-zone { position: absolute; bottom: 30px; left: 30px; width: 150px; height: 150px; background: rgba(255, 255, 255, 0.05); border: 2px dashed rgba(255, 255, 255, 0.2); border-radius: 50%; pointer-events: auto; }
    #joystick-knob { position: absolute; top: 50%; left: 50%; width: 50px; height: 50px; background: rgba(255, 255, 255, 0.6); border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; }
    #action-btn { position: absolute; bottom: 30px; right: 30px; width: 100px; height: 100px; border-radius: 50%; background: #b71c1c; border: 3px solid #ff4444; color: #fff; font-size: 14px; font-weight: bold; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 15px rgba(255, 0, 0, 0.6); pointer-events: auto; }
    #action-btn:active { background: #d32f2f; transform: scale(0.95); }
    #flashlight-zone { display: none; position: absolute; bottom: 30px; right: 150px; width: 110px; height: 110px; background: rgba(25, 118, 210, 0.15); border: 2px dashed rgba(25, 118, 210, 0.4); border-radius: 50%; pointer-events: auto; }
    #flashlight-knob { position: absolute; top: 50%; left: 50%; width: 40px; height: 40px; background: rgba(25, 118, 210, 0.8); border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; }
  </style>
</head>
<body>
  <div id="lobby-ui">
    <h1 style="font-size: 40px; margin-bottom: 50px;">DEAD BY DAYLIGHT</h1>
    <div id="lobby-controls" style="display:flex; flex-direction:column; align-items:center;">
      <button class="lobby-btn" onclick="createRoom()">Создать игру (Маньяк)</button>
      <div style="margin: 20px 0; color: #777;">ИЛИ</div>
      <input id="room-input" type="text" placeholder="Код комнаты">
      <button class="lobby-btn" onclick="joinRoom()">Зайти (Выживший)</button>
    </div>
    <div id="room-wait" style="display:none; text-align:center;">
      <h2>Код комнаты: <span id="room-code-display" style="color:#eab308; font-size:32px;"></span></h2>
      <ul id="players-list" style="list-style:none; padding:0; font-size:20px; color:#aaa; margin-bottom: 30px;"></ul>
      <button id="start-btn" class="lobby-btn" style="display:none; background:#22c55e;" onclick="startGame()">НАЧАТЬ МАТЧ</button>
    </div>
  </div>

  <div id="game-container">
    <canvas id="gameCanvas"></canvas>
    <button id="fullscreen-btn" onclick="toggleFullscreen(event)">⛶ Экран</button>
    <div id="game-ui">
      <div id="hud">
        <div>ГЕНЕРАТОРЫ: <span id="gens-left">4</span></div>
        <div>СТАТУС: <span id="player-hp">ЗДОРОВ</span></div>
      </div>
      <div id="joystick-zone"><div id="joystick-knob"></div></div>
      <div id="flashlight-zone"><div id="flashlight-knob"></div></div>
      <div id="action-btn">ДЕЙСТВИЕ</div>
    </div>
  </div>

  <script>
    function toggleFullscreen(e) {
      if(e) e.stopPropagation();
      const doc = window.document; const docEl = doc.documentElement;
      const req = docEl.requestFullscreen || docEl.webkitRequestFullscreen;
      if (!doc.fullscreenElement) { if (req) req.call(docEl).catch(()=>{}); } else { if (doc.exitFullscreen) doc.exitFullscreen(); }
      setTimeout(resize, 200);
    }
    
    let audioCtx = null;
    function initAudio() {
      try {
        const AudioClass = window.AudioContext || window.webkitAudioContext;
        if (AudioClass && !audioCtx) audioCtx = new AudioClass();
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      } catch (err) {}
    }
    function playTone(freq, duration, type = 'sine') {
      try {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
        osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    const socket = io();
    let myRole = null, myId = null, currentRoom = null, otherPlayers = {};
    let gameState = 'LOBBY';
    let syncTimer = 0;
    
    function createRoom() { socket.emit('createRoom'); initAudio(); }
    function joinRoom() { const id = document.getElementById('room-input').value; if(id) { socket.emit('joinRoom', id); initAudio(); } }
    function startGame() { socket.emit('startGame', currentRoom); }

    socket.on('roomCreated', (roomId, role) => {
      myRole = role; myId = socket.id; currentRoom = roomId;
      document.getElementById('lobby-controls').style.display = 'none'; document.getElementById('room-wait').style.display = 'block';
      document.getElementById('room-code-display').innerText = roomId; document.getElementById('start-btn').style.display = 'block';
    });

    socket.on('roomJoined', (roomId, role) => {
      myRole = role; myId = socket.id; currentRoom = roomId;
      document.getElementById('lobby-controls').style.display = 'none'; document.getElementById('room-wait').style.display = 'block';
      document.getElementById('room-code-display').innerText = roomId;
    });

    socket.on('updatePlayers', (players) => {
      const list = document.getElementById('players-list'); list.innerHTML = '';
      players.forEach(p => { const li = document.createElement('li'); li.innerText = p.role === 'KILLER' ? '👹 Маньяк (Хост)' : '🏃 Выживший'; list.appendChild(li); });
    });
    socket.on('error', msg => alert(msg));

    socket.on('gameStarted', (seed) => { initGame(); });

    const canvas = document.getElementById('gameCanvas'); const ctx = canvas.getContext('2d');
    const MAP_WIDTH = 1800, MAP_HEIGHT = 1400; let camera = { x: 0, y: 0 };
    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resize); resize();

    const actionBtn = document.getElementById('action-btn');
    const joyZone = document.getElementById('joystick-zone'), joyKnob = document.getElementById('joystick-knob');
    const fJoyZone = document.getElementById('flashlight-zone'), fJoyKnob = document.getElementById('flashlight-knob');

    let player = { x: 0, y: 0, radius: 18, speed: 4.5, hp: 2, angle: Math.PI/2, item: null, battery: 0, flashlightActive: false, flashlightAngle: 0, isRepairing: false, repairTarget: null, vaulting: false, vaultProgress: 0, vaultStartX: 0, vaultStartY: 0, vaultEndX: 0, vaultEndY: 0, state: 'IDLE', blindProgress: 0, blindTimer: 0, stunTimer: 0, shakeTimer: 0, invTimer: 0 };
    
    const obstacles = [ { x: 400, y: 300, w: 120, h: 80 }, { x: 400, y: 460, w: 120, h: 60 }, { x: 800, y: 200, w: 250, h: 100 }, { x: 1200, y: 450, w: 100, h: 120 }, { x: 1200, y: 650, w: 100, h: 100 }, { x: 300, y: 800, w: 300, h: 90 }, { x: 850, y: 750, w: 180, h: 180 }, { x: 600, y: 1100, w: 100, h: 80 }, { x: 780, y: 1100, w: 170, h: 80 } ];
    const windows = [ { x: 400, y: 380, w: 120, h: 80, dir: 'V' }, { x: 1200, y: 570, w: 100, h: 80, dir: 'V' }, { x: 700, y: 1100, w: 80, h: 80, dir: 'H' } ];
    let generators = [], pallets = [], chests = [], exitGate = { x: 1720, y: 650, w: 60, h: 120, progress: 0, isOpen: false };

    function initGame() {
      gameState = 'PLAYING';
      document.getElementById('lobby-ui').style.display = 'none';
      document.getElementById('game-container').style.display = 'block';
      document.getElementById('game-ui').style.display = 'block'; fJoyZone.style.display = 'none';
      
      if (myRole === 'KILLER') { player.x = 1400; player.y = 1000; player.radius = 22; player.speed = 4.2; } 
      else { player.x = 220 + Math.random()*50; player.y = 220 + Math.random()*50; player.radius = 18; player.speed = 4.5; }
      
      generators = [{x: 260, y: 550}, {x: 950, y: 350}, {x: 600, y: 950}, {x: 1450, y: 850}].map((g,i) => ({x: g.x, y: g.y, progress: 0, done: false, idx: i}));
      pallets = [{ x: 520, y: 350, w: 20, h: 120, cx: 530, cy: 410 }, { x: 700, y: 150, w: 100, h: 20, cx: 750, cy: 160 }, { x: 1050, y: 750, w: 20, h: 150, cx: 1060, cy: 825 }, { x: 600, y: 750, w: 150, h: 20, cx: 675, cy: 760 }, { x: 1100, y: 250, w: 20, h: 100, cx: 1110, cy: 300 }].map((p,i) => ({...p, state: 'up', idx: i}));
      chests = [{ x: 100, y: 100, progress: 0, isOpen: false, idx: 0 }, { x: 1700, y: 1300, progress: 0, isOpen: false, idx: 1 }];
      requestAnimationFrame(loop);
    }
        function endGame(winner) {
      gameState = 'LOBBY';
      document.getElementById('game-container').style.display = 'none'; document.getElementById('lobby-ui').style.display = 'flex';
      document.getElementById('room-wait').style.display = 'none'; document.getElementById('lobby-controls').style.display = 'flex';
      
      let resText = winner === 'KILLER' ? 'МАНЬЯК ПОБЕДИЛ!' : 'ВЫЖИВШИЕ СБЕЖАЛИ!';
      let resColor = winner === 'KILLER' ? '#ff3333' : '#4ade80';
      let resDiv = document.getElementById('game-result');
      if(!resDiv) { resDiv = document.createElement('h2'); resDiv.id = 'game-result'; document.getElementById('lobby-controls').prepend(resDiv); }
      resDiv.innerText = resText; resDiv.style.color = resColor;
      player.isRepairing = false; player.repairTarget = null; skillCheck.active = false;
    }

    function sendAction(data) { socket.emit('action', data); applyAction(data); }

    function applyAction(data) {
      if (data.type === 'dropPallet' && pallets[data.idx]) pallets[data.idx].state = 'dropped';
      if (data.type === 'breakPallet' && pallets[data.idx]) pallets[data.idx].state = 'broken';
      if (data.type === 'stunKiller' && data.targetId === myId) { player.shakeTimer = 30; player.stunTimer = 120; playTone(100, 0.5, 'sawtooth'); }
      if (data.type === 'attacked' && data.targetId === myId && player.invTimer <= 0) { 
          player.hp--; player.invTimer = 90; playTone(110, 0.35, 'sawtooth'); 
          if (player.hp <= 0) sendAction({type: 'gameOver', winner: 'KILLER'}); 
      }
      if (data.type === 'syncProgress') {
          let tgt = data.obj === 'gen' ? generators[data.idx] : (data.obj === 'chest' ? chests[data.idx] : exitGate);
          tgt.progress = data.val;
      }
      if (data.type === 'completeObj') {
          let tgt = data.obj === 'gen' ? generators[data.idx] : (data.obj === 'chest' ? chests[data.idx] : exitGate);
          tgt.progress = 100;
          if (data.obj === 'gen') { tgt.done = true; playTone(880, 0.3, 'sine'); }
          if (data.obj === 'chest') {
              tgt.isOpen = true; playTone(600, 0.2, 'sine');
              if (player.repairTarget && player.repairTarget.type === 'chest' && player.repairTarget.idx === data.idx) {
                  player.item = 'flashlight'; player.battery = 100; fJoyZone.style.display = 'block'; player.isRepairing = false;
              }
          }
          if (data.obj === 'gate') { exitGate.isOpen = true; }
      }
      if (data.type === 'gameOver') { endGame(data.winner); }
    }
    
    socket.on('syncAction', (data) => applyAction(data));
    
    socket.on('playerMoved', (data) => {
      if (!otherPlayers[data.id]) { otherPlayers[data.id] = { hp: 2, radius: data.role === 'KILLER' ? 22 : 18 }; }
      otherPlayers[data.id] = { ...otherPlayers[data.id], ...data };
    });

    const skillCheck = { active: false, angle: 0, speed: 0.05, sStart: 0, sEnd: 0, gStart: 0, gEnd: 0 };
    function triggerSkillCheck() {
      if (skillCheck.active || player.vaulting) return;
      skillCheck.active = true; skillCheck.angle = 0; skillCheck.speed = 0.045 + Math.random() * 0.02;
      const start = 1.6 + Math.random() * 2.2; skillCheck.sStart = start; skillCheck.sEnd = start + 0.8; skillCheck.gStart = skillCheck.sEnd - 0.2; skillCheck.gEnd = skillCheck.sEnd;
      playTone(850, 0.12, 'sine');
    }
    
    function resolveSkillCheck() {
      if (!skillCheck.active) return; const ang = skillCheck.angle;
      let tgt = player.repairTarget; if (!tgt) { skillCheck.active = false; return; }
      let targetObj = tgt.type === 'gen' ? generators[tgt.idx] : (tgt.type === 'chest' ? chests[tgt.idx] : exitGate);

      if (ang >= skillCheck.gStart && ang <= skillCheck.gEnd) { targetObj.progress = Math.min(100, targetObj.progress + 6); playTone(1200, 0.15, 'sine'); } 
      else if (ang >= skillCheck.sStart && ang <= skillCheck.sEnd) { targetObj.progress = Math.min(100, targetObj.progress + 2); playTone(950, 0.1, 'sine'); } 
      else { targetObj.progress = Math.max(0, targetObj.progress - 12); playTone(150, 0.4, 'sawtooth'); }
      
      sendAction({type: 'syncProgress', obj: tgt.type, idx: tgt.idx, val: targetObj.progress});
      if (targetObj.progress >= 100) { sendAction({type: 'completeObj', obj: tgt.type, idx: tgt.idx}); player.isRepairing = false; player.repairTarget = null; }
      skillCheck.active = false;
    }

    function startVault(obj) {
        let isVertical = obj.h > obj.w;
        if (isVertical) {
           let leftSide = player.x < obj.x + obj.w / 2;
           player.vaultStartX = player.x; player.vaultStartY = player.y; player.vaultEndX = leftSide ? obj.x + obj.w + 35 : obj.x - 35; player.vaultEndY = player.y;
        } else {
           let topSide = player.y < obj.y + obj.h / 2;
           player.vaultStartX = player.x; player.vaultStartY = player.y; player.vaultEndX = player.x; player.vaultEndY = topSide ? obj.y + obj.h + 35 : obj.y - 35;
        }
        player.vaulting = true; player.vaultProgress = 0; player.isRepairing = false; skillCheck.active = false;
    }

    actionBtn.addEventListener('pointerdown', (e) => {
      e.stopPropagation();
      if (skillCheck.active) { resolveSkillCheck(); return; }
      if (player.vaulting || player.stunTimer > 0) return;

      if (myRole === 'SURVIVOR') {
          for (let p of pallets) { if (p.state === 'dropped' && Math.hypot(player.x - p.x - p.w/2, player.y - p.y - p.h/2) < 80) { startVault(p); return; } }
          for (let w of windows) { if (Math.hypot(player.x - w.x - w.w/2, player.y - w.y - w.h/2) < 80) { startVault(w); return; } }
          for (let p of pallets) {
              if (p.state === 'up' && Math.hypot(player.x - p.cx, player.y - p.cy) < 70) {
                  sendAction({type: 'dropPallet', idx: p.idx}); playTone(200, 0.2, 'square');
                  let kId = Object.keys(otherPlayers).find(id => otherPlayers[id].role === 'KILLER');
                  if (kId && Math.hypot(otherPlayers[kId].x - p.cx, otherPlayers[kId].y - p.cy) < 120) { sendAction({type: 'stunKiller', targetId: kId}); }
                  return;
              }
          }
          for (let c of chests) { if (!c.isOpen && Math.hypot(player.x - c.x, player.y - c.y) < 75) { player.isRepairing = !player.isRepairing; player.repairTarget = player.isRepairing ? {type: 'chest', idx: c.idx} : null; return; } }
          for (let g of generators) { if (!g.done && Math.hypot(player.x - g.x, player.y - g.y) < 75) { player.isRepairing = !player.isRepairing; player.repairTarget = player.isRepairing ? {type: 'gen', idx: g.idx} : null; return; } }
          if (generators.filter(g => !g.done).length === 0 && Math.hypot(player.x - (exitGate.x+30), player.y - (exitGate.y+60)) < 95) { player.isRepairing = !player.isRepairing; player.repairTarget = player.isRepairing ? {type: 'gate', idx: 0} : null; }
      } else if (myRole === 'KILLER') {
          player.state = 'ATTACK'; setTimeout(() => player.state = 'IDLE', 500);
          let hit = false;
          for (let id in otherPlayers) {
              let op = otherPlayers[id];
              if (op.role === 'SURVIVOR' && Math.hypot(player.x - op.x, player.y - op.y) < 60) { sendAction({type: 'attacked', targetId: id}); hit = true; }
          }
          if (!hit) playTone(50, 0.2, 'sine');
          for (let p of pallets) { if (p.state === 'dropped' && Math.hypot(player.x - p.cx, player.y - p.cy) < 70) { sendAction({type: 'breakPallet', idx: p.idx}); playTone(150, 0.3, 'square'); } }
      }
    });

    let joyV = { x: 0, y: 0 }, joyTouchId = null;
    function updateJoy(cx, cy) {
      const rect = joyZone.getBoundingClientRect(); let dx = cx - (rect.left + rect.width / 2), dy = cy - (rect.top + rect.height / 2);
      const dist = Math.hypot(dx, dy), maxR = rect.width / 2; if (dist > maxR) { dx = (dx / dist) * maxR; dy = (dy / dist) * maxR; }
      joyKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`; joyV.x = dx / maxR; joyV.y = dy / maxR;
    }
    function resetJoy() { joyV = {x:0, y:0}; joyKnob.style.transform = `translate(-50%, -50%)`; joyTouchId = null; }
    joyZone.addEventListener('pointerdown', (e) => { joyTouchId = e.pointerId; updateJoy(e.clientX, e.clientY); joyZone.setPointerCapture(e.pointerId); });
    joyZone.addEventListener('pointermove', (e) => { if (joyTouchId === e.pointerId) updateJoy(e.clientX, e.clientY); });
    joyZone.addEventListener('pointerup', resetJoy); joyZone.addEventListener('pointercancel', resetJoy);

    let fJoyV = { active: false, angle: 0 }, fJoyTouchId = null;
    function updateFJoy(cx, cy) {
      const rect = fJoyZone.getBoundingClientRect(); let dx = cx - (rect.left + rect.width / 2), dy = cy - (rect.top + rect.height / 2);
      const dist = Math.hypot(dx, dy), maxR = rect.width / 2; if (dist > maxR) { dx = (dx / dist) * maxR; dy = (dy / dist) * maxR; }
      fJoyKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
      if (dist > 5) { fJoyV.angle = Math.atan2(dy, dx); fJoyV.active = true; } else { fJoyV.active = false; }
    }
    function resetFJoy() { fJoyV.active = false; fJoyKnob.style.transform = `translate(-50%, -50%)`; fJoyTouchId = null; }
    fJoyZone.addEventListener('pointerdown', (e) => { fJoyTouchId = e.pointerId; updateFJoy(e.clientX, e.clientY); fJoyZone.setPointerCapture(e.pointerId); });
    fJoyZone.addEventListener('pointermove', (e) => { if (fJoyTouchId === e.pointerId) updateFJoy(e.clientX, e.clientY); });
    fJoyZone.addEventListener('pointerup', resetFJoy); fJoyZone.addEventListener('pointercancel', resetFJoy);
    const keys = {}; window.addEventListener('keydown', e => keys[e.code] = true); window.addEventListener('keyup', e => keys[e.code] = false);

    function checkWall(x, y, r, isKiller = false) {
      if (x - r < 0 || x + r > MAP_WIDTH || y - r < 0 || y + r > MAP_HEIGHT) return true;
      for (let b of obstacles) { const cx = Math.max(b.x, Math.min(x, b.x + b.w)), cy = Math.max(b.y, Math.min(y, b.y + b.h)); if (((x - cx)**2 + (y - cy)**2) < r**2) return true; }
      if (isKiller) { for (let w of windows) { const cx = Math.max(w.x, Math.min(x, w.x + w.w)), cy = Math.max(w.y, Math.min(y, w.y + w.h)); if (((x - cx)**2 + (y - cy)**2) < r**2) return true; } }
      for (let p of pallets) { if (p.state === 'dropped') { const cx = Math.max(p.x, Math.min(x, p.x + p.w)), cy = Math.max(p.y, Math.min(y, p.y + p.h)); if (((x - cx)**2 + (y - cy)**2) < r**2) return true; } }
      return false;
    }
    
    function checkLOS(x1, y1, x2, y2) {
      function ccw(A, B, C) { return (C.y-A.y)*(B.x-A.x) > (B.y-A.y)*(C.x-A.x); }
      function intersect(A, B, C, D) { return ccw(A,C,D) !== ccw(B,C,D) && ccw(A,B,C) !== ccw(A,B,D); }
      let A = {x: x1, y: y1}, B = {x: x2, y: y2};
      for (let ob of obstacles) { let C1 = {x: ob.x, y: ob.y}, C2 = {x: ob.x+ob.w, y: ob.y}, C3 = {x: ob.x+ob.w, y: ob.y+ob.h}, C4 = {x: ob.x, y: ob.y+ob.h}; if (intersect(A,B,C1,C2) || intersect(A,B,C2,C3) || intersect(A,B,C3,C4) || intersect(A,B,C4,C1)) return false; }
      return true;
    }
        function update() {
      if (player.vaulting) {
          player.vaultProgress += 0.04; 
          if (player.vaultProgress >= 1) { player.vaulting = false; player.x = player.vaultEndX; player.y = player.vaultEndY; } 
          else { player.x = player.vaultStartX + (player.vaultEndX - player.vaultStartX) * player.vaultProgress; player.y = player.vaultStartY + (player.vaultEndY - player.vaultStartY) * player.vaultProgress; }
      } else if (player.stunTimer <= 0) {
          let mx = joyV.x, my = joyV.y;
          if (keys['KeyW'] || keys['ArrowUp']) my -= 1; if (keys['KeyS'] || keys['ArrowDown']) my += 1;
          if (keys['KeyA'] || keys['ArrowLeft']) mx -= 1; if (keys['KeyD'] || keys['ArrowRight']) mx += 1;
          const len = Math.hypot(mx, my);
          if (len > 0.05) {
            player.isRepairing = false; player.repairTarget = null; player.angle = Math.atan2(my, mx);
            const nx = player.x + (mx / len) * player.speed, ny = player.y + (my / len) * player.speed;
            if (!checkWall(nx, player.y, player.radius, myRole === 'KILLER')) player.x = nx;
            if (!checkWall(player.x, ny, player.radius, myRole === 'KILLER')) player.y = ny;
          }
      }

      if (player.invTimer > 0) player.invTimer--;
      if (player.stunTimer > 0) player.stunTimer--;
      if (player.shakeTimer > 0) player.shakeTimer--;
      if (player.blindTimer > 0) player.blindTimer--;

      if (player.isRepairing && player.repairTarget) {
          let tgt = player.repairTarget;
          let targetObj = tgt.type === 'gen' ? generators[tgt.idx] : (tgt.type === 'chest' ? chests[tgt.idx] : exitGate);

          if (!targetObj.done && !targetObj.isOpen) {
              targetObj.progress += 0.25;
              syncTimer++;
              if (syncTimer > 30) {
                  socket.emit('action', {type: 'syncProgress', obj: tgt.type, idx: tgt.idx, val: targetObj.progress});
                  syncTimer = 0;
              }
              if (targetObj.progress >= 100) {
                  sendAction({type: 'completeObj', obj: tgt.type, idx: tgt.idx});
                  player.isRepairing = false; player.repairTarget = null;
              } else if (!skillCheck.active && tgt.type === 'gen' && Math.random() < 0.009) {
                  triggerSkillCheck();
              }
          }
      }
      
      if (skillCheck.active) { skillCheck.angle += skillCheck.speed; if (skillCheck.angle > Math.PI * 2) resolveSkillCheck(); }
      
      if (myRole === 'SURVIVOR') {
          player.flashlightActive = (fJoyV.active && player.item === 'flashlight' && player.battery > 0 && !player.vaulting);
          if (player.flashlightActive) {
              player.battery -= 0.15; player.isRepairing = false; player.repairTarget = null; player.flashlightAngle = fJoyV.angle;
              if (player.battery <= 0) { player.item = null; fJoyZone.style.display = 'none'; resetFJoy(); }
          }
          if (exitGate.isOpen && player.x > exitGate.x + 25) { sendAction({type: 'gameOver', winner: 'SURVIVORS'}); }
      } else if (myRole === 'KILLER' && player.stunTimer <= 0) {
          let beingBlinded = false;
          for (let id in otherPlayers) {
              let op = otherPlayers[id];
              if (op.role === 'SURVIVOR' && op.flashlightActive) {
                  let angleDiff = Math.abs(Math.atan2(player.y - op.y, player.x - op.x) - op.flashlightAngle);
                  if (angleDiff > Math.PI) angleDiff = 2*Math.PI - angleDiff;
                  if (angleDiff < 0.35 && Math.hypot(player.x - op.x, player.y - op.y) < 350 && checkLOS(player.x, player.y, op.x, op.y)) {
                      let kLookDiff = Math.abs(Math.atan2(op.y - player.y, op.x - player.x) - player.angle);
                      if (kLookDiff > Math.PI) kLookDiff = 2*Math.PI - kLookDiff;
                      if (kLookDiff < Math.PI/2) {
                          beingBlinded = true; player.blindProgress += 2.5;
                          if (player.blindProgress >= 100) { player.blindProgress = 0; player.blindTimer = 150; player.stunTimer = 150; playTone(300, 0.4, 'sawtooth'); }
                      }
                  }
              }
          }
          if (!beingBlinded) player.blindProgress = Math.max(0, player.blindProgress - 1);
      }

      socket.emit('playerMove', { role: myRole, x: player.x, y: player.y, angle: player.angle, state: player.state, flashlightActive: player.flashlightActive, flashlightAngle: player.flashlightAngle });
      
      const rem = generators.filter(g => !g.done).length;
      document.getElementById('gens-left').innerText = rem > 0 ? rem : 'ВОРОТА!';
      document.getElementById('player-hp').innerText = myRole === 'KILLER' ? 'МАНЬЯК' : (player.hp === 2 ? 'ЗДОРОВ' : 'РАНЕН');
      document.getElementById('player-hp').style.color = myRole === 'KILLER' ? '#ff4444' : (player.hp === 2 ? '#4ade80' : '#ff4444');
    }
    
    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const cx = canvas.width / 2, cy = canvas.height / 2;
      
      let shakeX = 0, shakeY = 0;
      if (myRole === 'KILLER' && player.shakeTimer > 0) {
          shakeX = (Math.random() - 0.5) * 30; shakeY = (Math.random() - 0.5) * 30;
      }
      
      camera.x = Math.max(0, Math.min(player.x - cx, MAP_WIDTH - canvas.width));
      camera.y = Math.max(0, Math.min(player.y - cy, MAP_HEIGHT - canvas.height));
      ctx.save(); ctx.translate(-camera.x + shakeX, -camera.y + shakeY);

      ctx.fillStyle = "#141714"; ctx.fillRect(0, 0, MAP_WIDTH, MAP_HEIGHT);
      ctx.strokeStyle = "#1f241f"; ctx.lineWidth = 2;
      for (let x = 0; x < MAP_WIDTH; x+=100) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,MAP_HEIGHT); ctx.stroke(); }
      for (let y = 0; y < MAP_HEIGHT; y+=100) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(MAP_WIDTH,y); ctx.stroke(); }

      ctx.fillStyle = "#2c332d"; ctx.strokeStyle = "#404c42"; ctx.lineWidth = 3;
      obstacles.forEach(o => { ctx.fillRect(o.x, o.y, o.w, o.h); ctx.strokeRect(o.x, o.y, o.w, o.h); });
      for(let w of windows) { ctx.fillStyle = "#334455"; ctx.fillRect(w.x, w.y, w.w, w.h); ctx.strokeStyle = "#5588aa"; ctx.lineWidth = 2; ctx.strokeRect(w.x, w.y, w.w, w.h); }

      ctx.fillStyle = exitGate.isOpen ? "#22c55e" : "#444"; ctx.fillRect(exitGate.x, exitGate.y, exitGate.w, exitGate.h);
      if (!exitGate.isOpen && exitGate.progress > 0) { ctx.fillStyle = "#ffaa00"; ctx.fillRect(exitGate.x-10, exitGate.y-15, (exitGate.progress/100)*80, 8); }

      for (let p of pallets) {
        if (p.state === 'broken') continue;
        if (p.state === 'up') { ctx.fillStyle = '#b45309'; ctx.fillRect(p.cx - 10, p.cy - 10, 20, 20); ctx.fillStyle = '#fef3c7'; ctx.fillRect(p.cx - 4, p.cy - 4, 8, 8); } 
        else if (p.state === 'dropped') { ctx.fillStyle = '#78350f'; ctx.fillRect(p.x, p.y, p.w, p.h); }
      }
      for (let c of chests) {
        ctx.fillStyle = c.isOpen ? "#78350f" : "#d97706"; ctx.fillRect(c.x-15, c.y-15, 30, 30); ctx.strokeStyle = "#fff"; ctx.strokeRect(c.x-15, c.y-15, 30, 30);
        if (!c.isOpen && c.progress > 0) { ctx.fillStyle = "#fff"; ctx.fillRect(c.x-20, c.y-25, (c.progress/100)*40, 6); }
      }
      generators.forEach(g => {
        ctx.fillStyle = g.done ? "#22c55e" : "#eab308"; ctx.fillRect(g.x-22, g.y-22, 44, 44); ctx.strokeStyle = "#fff"; ctx.strokeRect(g.x-22, g.y-22, 44, 44);
        if (!g.done && g.progress > 0) { ctx.fillStyle = "#3b82f6"; ctx.fillRect(g.x-30, g.y-35, (g.progress/100)*60, 8); }
      });

      for (let id in otherPlayers) {
          let op = otherPlayers[id];
          ctx.beginPath(); ctx.arc(op.x, op.y, op.radius, 0, Math.PI*2);
          ctx.fillStyle = op.role === 'KILLER' ? (op.state === 'ATTACK' || op.stunTimer > 0 ? "#ef4444" : "#991b1b") : "#3b82f6";
          ctx.fill(); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(op.x, op.y); ctx.arc(op.x, op.y, op.radius + 15, op.angle - 0.3, op.angle + 0.3);
          ctx.fillStyle = "rgba(255,255,255,0.3)"; ctx.fill();
          
          if (op.role === 'SURVIVOR' && op.flashlightActive) {
              ctx.beginPath(); ctx.moveTo(op.x, op.y); ctx.arc(op.x, op.y, 350, op.flashlightAngle - 0.35, op.flashlightAngle + 0.35);
              ctx.fillStyle = "rgba(255, 255, 180, 0.4)"; ctx.fill();
          }
      }

      ctx.beginPath(); ctx.arc(player.x, player.y, player.radius, 0, Math.PI*2);
      ctx.fillStyle = myRole === 'KILLER' ? (player.state === 'ATTACK' || player.stunTimer > 0 ? "#ef4444" : "#991b1b") : (player.hp === 1 ? "#ef4444" : "#3b82f6");
      if (player.invTimer % 6 < 3) { ctx.fill(); ctx.stroke(); }
      ctx.beginPath(); ctx.moveTo(player.x, player.y); ctx.arc(player.x, player.y, player.radius + 15, player.angle - 0.3, player.angle + 0.3);
      ctx.fillStyle = "rgba(255,255,255,0.5)"; ctx.fill();

      if (myRole === 'SURVIVOR' && player.flashlightActive) {
          ctx.beginPath(); ctx.moveTo(player.x, player.y); ctx.arc(player.x, player.y, 350, player.flashlightAngle - 0.35, player.flashlightAngle + 0.35);
          ctx.fillStyle = "rgba(255, 255, 180, 0.4)"; ctx.fill();
      }
      ctx.restore();

      if (myRole === 'KILLER') {
          let blindAlpha = 0;
          if (player.blindTimer > 0) blindAlpha = 1;
          else if (player.blindProgress > 0) blindAlpha = player.blindProgress / 100;
          
          if (blindAlpha > 0) {
              ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = `rgba(255, 255, 255, ${blindAlpha})`; ctx.fillRect(0, 0, canvas.width, canvas.height);
          }
      }

      if (skillCheck.active) {
        ctx.beginPath(); ctx.arc(cx, cy, 65, 0, Math.PI*2); ctx.strokeStyle="rgba(255,255,255,0.3)"; ctx.lineWidth=14; ctx.stroke();
        ctx.beginPath(); ctx.arc(cx, cy, 65, skillCheck.sStart, skillCheck.sEnd); ctx.strokeStyle="rgba(255,255,255,0.9)"; ctx.stroke();
        ctx.beginPath(); ctx.arc(cx, cy, 65, skillCheck.gStart, skillCheck.gEnd); ctx.strokeStyle="#eab308"; ctx.stroke();
        const nx = cx + Math.cos(skillCheck.angle)*65, ny = cy + Math.sin(skillCheck.angle)*65;
        ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(nx, ny); ctx.strokeStyle="#ef4444"; ctx.lineWidth=5; ctx.stroke();
      }
    }
    
    function loop() { if (gameState === 'PLAYING') { update(); render(); } requestAnimationFrame(loop); }
  </script>
</body>
